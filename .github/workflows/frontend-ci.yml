name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/frontend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: ./frontend
        run: pnpm typecheck

      - name: Lint
        working-directory: ./frontend
        run: pnpm lint

      # Vitest only. The RSVP chat test mocks the server action and the lib
      # tests are pure, so no Sanity / Google / Resend secrets are needed.
      # Playwright E2E (pnpm test:e2e) boots a dev server against the live
      # dataset and is run locally, not in CI.
      - name: Unit tests
        working-directory: ./frontend
        run: pnpm test
